<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San George</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#161a22;--mut:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8eaf0;--mut:#8b93a3;--bd:#262b37;--ac:#4f8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:28px;font-weight:700;margin:0;background:linear-gradient(90deg,#ff0040,#ff9500,#ffee00,#00e676,#00b0ff,#7c4dff,#ff0040);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rgb 6s linear infinite}
@keyframes rgb{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.sec{margin-bottom:16px}.val{font-size:22px;font-weight:700;color:var(--ac)}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--bd);color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,textarea{font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
button.s{padding:3px 10px;font-size:13px}
input,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;flex:1;min-width:150px}
input[type=checkbox]{flex:none;min-width:0}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--mut)}
#admin{border:2px solid var(--ac)}
.credit{display:flex;justify-content:center;align-items:center;gap:12px;margin:0 0 20px;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);direction:ltr}
.credit::before,.credit::after{content:'';width:32px;height:1px;background:var(--bd)}
.credit b{color:var(--tx);font-weight:700;letter-spacing:.32em}
</style>
</head>
<body>
<div class="wrap">
<div class="credit">created by <b>KRISTIAN</b></div>
<header>
  <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <div class="row" id="hb"></div>
</header>
<div id="app"></div>
</div>
<script>
(function(){
var KEY='data-site-v1';
var S={title:'موقع البيانات',subtitle:'آخر البيانات المسجلة',items:[],f:{}};
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
var app=document.getElementById('app');
var q='',editId=null,delId=null,open=false,authOpen=false,logged=false;
try{logged=!!(S.auth&&S.auth.tok&&localStorage.getItem('ok')===S.auth.tok)}catch(e){}
async function hsh(p,salt){var d=salt+':'+p;try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){var h=5381;for(var i=0;i<d.length;i++)h=((h<<5)+h+d.charCodeAt(i))|0;return 'x'+h}}
function authForm(){
  var first=!S.auth;
  return '<div class="card sec" id="auth" style="max-width:420px"><h2>'+(first?'إنشاء حساب المالك':'تسجيل الدخول')+'</h2>'
  +(first?'<div class="sub sec">أول حساب بيتسجل هنا هو المالك، ومفيش حد تاني يقدر يسجل بعده.</div>':'')
  +'<div class="row sec"><input id="au" placeholder="اسم المستخدم" autocomplete="username"></div>'
  +'<div class="row sec"><input id="ap" type="password" placeholder="كلمة المرور" autocomplete="'+(first?'new-password':'current-password')+'"></div>'
  +(first?'<div class="row sec"><input id="ap2" type="password" placeholder="أكّد كلمة المرور" autocomplete="new-password"></div>':'')
  +'<div class="row"><button id="ago">'+(first?'إنشاء الحساب':'دخول')+'</button><button class="g" id="acx">إلغاء</button></div><div class="sub" id="aer" style="color:var(--bad);margin-top:8px"></div></div>';
}
var DF={name:'الاسم',value:'القيمة',cat:'التصنيف',note:'ملاحظة'};
function L(k){return (S.f&&S.f[k]&&S.f[k].l)||DF[k]}
function ON(k){return k==='name'||!(S.f&&S.f[k]&&S.f[k].off)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function fmt(t){try{return new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('تعذّر الحفظ في المتصفح.')}render()}
function pub(){
  var f=S.items.filter(function(i){return (i.name+' '+(i.cat||'')+' '+(i.note||'')).indexOf(q)>-1});
  var h='<div class="sec"><input id="q" placeholder="بحث…" value="'+esc(q)+'"></div>';
  if(!f.length)return h+'<div class="card empty">مفيش بيانات لسه</div>';
  h+='<div class="grid">';
  f.forEach(function(i){h+='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(i.name)+'</b>'+(i.cat&&ON('cat')?'<span class="tag">'+esc(i.cat)+'</span>':'')+'</div>'
   +(i.value&&ON('value')?'<div class="sub" style="font-size:12px">'+esc(L('value'))+'</div><div class="val">'+esc(i.value)+'</div>':'')
   +(i.note&&ON('note')?'<div class="sub">'+esc(i.note)+'</div>':'')
   +'<div class="sub" style="font-size:12px;margin-top:6px">'+esc(fmt(i.t))+'</div></div>'});
  return h+'</div>';
}
function admin(){
  var e=S.items.filter(function(i){return i.id===editId})[0]||{};
  var h='<div class="card sec" id="admin"><h2>لوحة التحكم</h2>'
  +'<div class="row sec"><input id="st" placeholder="عنوان الموقع" value="'+esc(S.title)+'"><input id="ss" placeholder="وصف قصير" value="'+esc(S.subtitle)+'"><button id="sv">حفظ العنوان</button></div>'
  +'<h2>الحقول (غيّر الاسم أو شيل الحقل)</h2>'+['name','value','cat','note'].map(function(k){return '<div class="row" style="margin-bottom:8px"><input id="lb_'+k+'" value="'+esc(L(k))+'">'+(k==='name'?'<span class="sub">أساسي</span>':'<label class="row sub" style="flex:none"><input type="checkbox" id="on_'+k+'" '+(ON(k)?'checked':'')+'> ظاهر</label>')+'</div>'}).join('')
  +'<div class="row sec"><button id="sf">حفظ الحقول</button></div>'
  +'<h2>'+(editId?'تعديل بيان':'إضافة بيان')+'</h2><div class="row sec"><input id="fn" placeholder="'+esc(L('name'))+' *" value="'+esc(e.name)+'">'
  +(ON('value')?'<input id="fv" placeholder="'+esc(L('value'))+'" value="'+esc(e.value)+'">':'')
  +(ON('cat')?'<input id="fc" placeholder="'+esc(L('cat'))+'" value="'+esc(e.cat)+'">':'')+'</div>'
  +(ON('note')?'<div class="row sec"><textarea id="fo" rows="2" placeholder="'+esc(L('note'))+'">'+esc(e.note)+'</textarea></div>':'')
  +'<div class="row sec"><button id="ad">'+(editId?'حفظ التعديل':'إضافة')+'</button>'+(editId?'<button class="g" id="cx">إلغاء</button>':'')+'</div>';
  if(S.items.length){h+='<div class="scroll sec"><table><thead><tr><th>'+esc(L('name'))+'</th>'+(ON('value')?'<th>'+esc(L('value'))+'</th>':'')+(ON('cat')?'<th>'+esc(L('cat'))+'</th>':'')+'<th></th></tr></thead><tbody>';
   S.items.forEach(function(i){h+='<tr><td>'+esc(i.name)+'</td>'+(ON('value')?'<td>'+esc(i.value)+'</td>':'')+(ON('cat')?'<td>'+esc(i.cat)+'</td>':'')+'<td><button class="g s" data-e="'+i.id+'">تعديل</button> <button class="d s" data-d="'+i.id+'">'+(delId===i.id?'تأكيد الحذف؟':'حذف')+'</button></td></tr>'});
   h+='</tbody></table></div>'}
  h+='<h2>نسخة احتياطية</h2><div class="row"><button class="g" id="ex">تصدير البيانات</button><button class="g" id="im">استيراد بيانات</button><input type="file" id="fi" accept=".json" style="display:none"></div>'
  +'<div class="sub" style="margin-top:8px">البيانات محفوظة في المتصفح ده بس. صدّرها من وقت للتاني.</div></div>';
  return h;
}
function bind(){
  var $a=function(i){return document.getElementById(i)};
  if($a('lg'))$a('lg').onclick=function(){authOpen=true;render()};
  if($a('tog'))$a('tog').onclick=function(){open=!open;render()};
  if($a('out'))$a('out').onclick=function(){logged=false;open=false;try{localStorage.removeItem('ok')}catch(e){}if(S.auth){delete S.auth.tok;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}render()};
  if($a('acx'))$a('acx').onclick=function(){authOpen=false;render()};
  if($a('ago'))$a('ago').onclick=async function(){
    var u=$a('au').value.trim(),p=$a('ap').value,er=$a('aer');
    if(!u||!p){er.textContent='اكتب اسم المستخدم وكلمة المرور.';return}
    if(!S.auth){
      if(p.length<6){er.textContent='كلمة المرور لازم تكون 6 حروف على الأقل.';return}
      if(p!==$a('ap2').value){er.textContent='كلمتين المرور مش متطابقين.';return}
      var salt=String(Math.random()).slice(2)+Date.now();
      S.auth={u:u.toLowerCase(),salt:salt,h:await hsh(p,salt)};
    }else if(u.toLowerCase()!==S.auth.u||await hsh(p,S.auth.salt)!==S.auth.h){er.textContent='اسم المستخدم أو كلمة المرور غلط.';return}
    logged=true;authOpen=false;open=true;var tk=String(Math.random()).slice(2)+Date.now()+String(Math.random()).slice(2);S.auth.tok=tk;try{localStorage.setItem('ok',tk)}catch(e){}save();
  };
  var qi=document.getElementById('q');
  if(qi)qi.oninput=function(){q=qi.value;var p=qi.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
  if(!document.getElementById('admin'))return;
  var $=function(i){return document.getElementById(i)};
  $('sv').onclick=function(){S.title=$('st').value.trim()||S.title;S.subtitle=$('ss').value.trim();save()};
  $('sf').onclick=function(){S.f={};['name','value','cat','note'].forEach(function(k){var c=$('on_'+k);S.f[k]={l:$('lb_'+k).value.trim()||DF[k],off:c?!c.checked:false}});save()};
  $('ad').onclick=function(){var n=$('fn').value.trim();if(!n)return $('fn').focus();
    var o={name:n,t:Date.now()};if($('fv'))o.value=$('fv').value.trim();if($('fc'))o.cat=$('fc').value.trim();if($('fo'))o.note=$('fo').value.trim();
    if(editId){S.items=S.items.map(function(i){return i.id===editId?Object.assign(i,o):i});editId=null}else{o.id='i'+Date.now();S.items.unshift(o)}
    save()};
  if($('cx'))$('cx').onclick=function(){editId=null;render()};
  app.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editId=b.dataset.e;render()}});
  app.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(delId===b.dataset.d){S.items=S.items.filter(function(i){return i.id!==delId});delId=null;save()}else{delId=b.dataset.d;render()}}});
  $('ex').onclick=function(){claude.use('downloads').then(function(d){if(!d){alert('التصدير مش متاح هنا.');return}return d.save({filename:'site-data.json',data:JSON.stringify(Object.assign({},S,{auth:undefined}),null,2)})}).catch(function(){})};
  $('im').onclick=function(){$('fi').click()};
  $('fi').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(!Array.isArray(d.items))throw 0;S=Object.assign({title:'',subtitle:'',items:[],f:{}},d,{auth:S.auth});save()}catch(e){alert('الملف مش صالح.')}};rd.readAsText(f)};
}
function render(){
  document.getElementById('ttl').textContent=S.title;document.getElementById('sub').textContent=S.subtitle;document.title=S.title;
  document.getElementById('hb').innerHTML=logged?'<button class="g" id="tog">'+(open?'إخفاء اللوحة':'لوحة التحكم')+'</button><button class="g" id="out">تسجيل خروج</button>':'<button class="g" id="lg">'+(S.auth?'تسجيل دخول':'إنشاء حساب المالك')+'</button>';
  app.innerHTML=(authOpen&&!logged?authForm():'')+(logged&&open?admin():'')+pub();bind();
}
render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San George</title>

<link rel="icon" type="image/png" href="sangeorge.png">


<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#161a22;--mut:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8eaf0;--mut:#8b93a3;--bd:#262b37;--ac:#4f8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.credit{display:flex;justify-content:center;align-items:center;gap:12px;margin:0 0 20px;font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut);direction:ltr}
.credit::before,.credit::after{content:'';width:32px;height:1px;background:var(--bd)}
.credit b{color:var(--tx);font-weight:700;letter-spacing:.32em}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:28px;font-weight:700;margin:0;background:linear-gradient(90deg,#ff0040,#ff9500,#ffee00,#00e676,#00b0ff,#7c4dff,#ff0040);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rgb 6s linear infinite}
@keyframes rgb{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.sec{margin-bottom:16px}.val{font-size:22px;font-weight:700;color:var(--ac)}
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;background:var(--bd);color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,textarea,select{font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
button.s{padding:3px 10px;font-size:13px}
input,textarea,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;flex:1;min-width:150px}
select{flex:none;min-width:0}input[type=checkbox]{flex:none;min-width:0}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--mut)}
#admin{border:2px solid var(--ac)}
.grid.c{grid-template-columns:repeat(var(--n),1fr)}
.lst{display:flex;flex-direction:column;gap:10px}
.lst .card{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.gh{font-size:15px;font-weight:700;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.gh span{font-weight:400;color:var(--mut);font-size:13px}
@media (max-width:640px){.grid.c{grid-template-columns:repeat(min(var(--n),2),1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="credit">created by <b>KRISTIAN</b></div>
<header>
  <div><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
  <div class="row" id="hb"></div>
</header>
<div id="app"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,addDoc,updateDoc,deleteDoc,getDoc,getDocs,query,orderBy,startAt,endAt,limit,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== الصق إعدادات Firebase بتاعتك هنا (من Project settings > Your apps) ===== */
const firebaseConfig={
  apiKey:"AIzaSyCdsuzTehWVAE9qLVlFTWlvBnYjUj411ps",
  authDomain:"san-george-1.firebaseapp.com",
  projectId:"san-george-1",
  storageBucket:"san-george-1.firebasestorage.app",
  messagingSenderId:"928300058101",
  appId:"1:928300058101:web:8fb533356bbb9009310cbc"
};
/* ================================================================================ */

const app=document.getElementById('app');
const DF={name:'الاسم',value:'القيمة',cat:'التصنيف',note:'ملاحظة'};
const RL={owner:'مالك',editor:'محرر',member:'عضو'};
const $=i=>document.getElementById(i);
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML.replace(/"/g,'&quot;')};
const fmt=t=>{try{return new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}};
const mail=u=>u+'@users.local';

if(firebaseConfig.apiKey.startsWith('YOUR')){
  app.innerHTML='<div class="card empty">لسه ما حطّيتش إعدادات Firebase. افتح الملف وعدّل firebaseConfig (الخطوات في README).</div>';
  $('ttl').textContent='موقع البيانات';
  throw new Error('firebaseConfig missing');
}

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
let cfg={title:'موقع البيانات',subtitle:'آخر البيانات المسجلة',f:{}},items=[],me=null,unMe=null;
let q='',editId=null,delId=null,open=false,authOpen=false,authMode='login',dirty=false,busy=false;
const L=k=>(cfg.f&&cfg.f[k]&&cfg.f[k].l)||DF[k];
const ON=k=>k==='name'||!(cfg.f&&cfg.f[k]&&cfg.f[k].off);
const canPanel=()=>me&&(me.role==='owner'||me.role==='editor');
const isOwner=()=>me&&me.role==='owner';
const err=m=>{const e=$('aer');if(e)e.textContent=m};
const fail=e=>{console.error(e);alert('حصلت مشكلة: '+(e&&e.code?e.code:'خطأ'))};

onSnapshot(doc(db,'site','config'),s=>{if(s.exists())cfg=Object.assign({title:'موقع البيانات',subtitle:'',f:{}},s.data());soft()},()=>soft());
onSnapshot(query(collection(db,'items'),orderBy('t','desc')),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));soft()},()=>soft());
onAuthStateChanged(auth,u=>{
  if(unMe){unMe();unMe=null}
  if(!u){me=null;open=false;return render()}
  unMe=onSnapshot(doc(db,'users',u.uid),s=>{
    me=s.exists()?{uid:u.uid,...s.data()}:null;
    if(me&&authOpen){authOpen=false;open=canPanel()}
    soft();
  },()=>{});
});

function soft(){const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='q'&&a.closest('#admin,#auth')){dirty=true;return}
  render()}
document.addEventListener('focusout',()=>{if(dirty){dirty=false;setTimeout(()=>{const a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))render()},60)}});

async function doAuth(){
  if(busy)return;
  const u=$('au').value.trim().toLowerCase(),p=$('ap').value,reg=authMode==='reg';
  if(!u||!p)return err('اكتب اسم المستخدم وكلمة المرور.');
  if(!/^[a-z0-9_.\-]{3,20}$/.test(u))return err('اسم المستخدم من 3 إلى 20 حرف إنجليزي أو أرقام أو _ . -');
  busy=true;$('ago').disabled=true;
  try{
    if(reg){
      if(p.length<6)throw {m:'كلمة المرور لازم تكون 6 حروف على الأقل.'};
      if(p!==$('ap2').value)throw {m:'كلمتين المرور مش متطابقين.'};
      const c=await createUserWithEmailAndPassword(auth,mail(u),p);
      const first=!(await getDoc(doc(db,'meta','owner'))).exists();
      if(first){
        const b=writeBatch(db);
        b.set(doc(db,'users',c.user.uid),{username:u,role:'owner',createdAt:serverTimestamp()});
        b.set(doc(db,'meta','owner'),{uid:c.user.uid});
        await b.commit();
        await setDoc(doc(db,'site','config'),{title:cfg.title,subtitle:cfg.subtitle,f:{}},{merge:true}).catch(()=>{});
      }else{
        await setDoc(doc(db,'users',c.user.uid),{username:u,role:'member',createdAt:serverTimestamp()});
      }
    }else{
      await signInWithEmailAndPassword(auth,mail(u),p);
    }
  }catch(e){
    const c=e&&e.code;
    err(e.m||(c==='auth/email-already-in-use'?'اسم المستخدم ده موجود قبل كده.':(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')?'اسم المستخدم أو كلمة المرور غلط.':c==='auth/operation-not-allowed'?'فعّل Email/Password من Authentication في Firebase.':c==='auth/too-many-requests'?'محاولات كتير، جرّب بعد شوية.':'حصلت مشكلة، جرّب تاني.'));
  }
  busy=false;const b=$('ago');if(b)b.disabled=false;
}

function authForm(){
  const reg=authMode==='reg';
  return `<div class="card sec" id="auth" style="max-width:420px"><h2>${reg?'إنشاء حساب جديد':'تسجيل الدخول'}</h2>
  <div class="sub sec">${reg?'أول حساب بيتسجل على الموقع هو المالك.':''}</div>
  <div class="row sec"><input id="au" placeholder="اسم المستخدم (إنجليزي)" autocomplete="username" dir="ltr"></div>
  <div class="row sec"><input id="ap" type="password" placeholder="كلمة المرور" autocomplete="${reg?'new-password':'current-password'}"></div>
  ${reg?'<div class="row sec"><input id="ap2" type="password" placeholder="أكّد كلمة المرور" autocomplete="new-password"></div>':''}
  <div class="row"><button id="ago">${reg?'إنشاء الحساب':'دخول'}</button><button class="g" id="acx">إلغاء</button><button class="g" id="asw">${reg?'عندي حساب':'إنشاء حساب جديد'}</button></div>
  <div class="sub" id="aer" style="color:var(--bad);margin-top:8px"></div></div>`;
}
const V=k=>{const d={view:'cards',cols:0,sort:'new',group:false};return (cfg.v&&cfg.v[k]!==undefined)?cfg.v[k]:d[k]};
function itemCard(i){return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(i.name)}</b>${i.cat&&ON('cat')?`<span class="tag">${esc(i.cat)}</span>`:''}</div>
   ${i.value&&ON('value')?`<div class="sub" style="font-size:12px">${esc(L('value'))}</div><div class="val">${esc(i.value)}</div>`:''}
   ${i.note&&ON('note')?`<div class="sub">${esc(i.note)}</div>`:''}
   <div class="sub" style="font-size:12px;margin-top:6px">${esc(fmt(i.t))}</div></div>`}
function itemRow(i){return `<div class="card"><div><b>${esc(i.name)}</b>${i.note&&ON('note')?`<div class="sub">${esc(i.note)}</div>`:''}</div>
   <div class="row">${i.cat&&ON('cat')?`<span class="tag">${esc(i.cat)}</span>`:''}${i.value&&ON('value')?`<span class="val" style="font-size:18px">${esc(i.value)}</span>`:''}<span class="sub" style="font-size:12px">${esc(fmt(i.t))}</span></div></div>`}
function block(list){
  const v=V('view');
  if(v==='list')return `<div class="lst">${list.map(itemRow).join('')}</div>`;
  if(v==='table')return `<div class="card scroll" style="padding:4px 8px"><table><thead><tr><th>${esc(L('name'))}</th>${ON('value')?`<th>${esc(L('value'))}</th>`:''}${ON('cat')?`<th>${esc(L('cat'))}</th>`:''}${ON('note')?`<th>${esc(L('note'))}</th>`:''}<th>التاريخ</th></tr></thead><tbody>${list.map(i=>`<tr><td>${esc(i.name)}</td>${ON('value')?`<td>${esc(i.value)}</td>`:''}${ON('cat')?`<td>${esc(i.cat)}</td>`:''}${ON('note')?`<td style="white-space:normal">${esc(i.note)}</td>`:''}<td>${esc(fmt(i.t))}</td></tr>`).join('')}</tbody></table></div>`;
  const n=+V('cols')||0;
  return n?`<div class="grid c" style="--n:${n}">${list.map(itemCard).join('')}</div>`:`<div class="grid">${list.map(itemCard).join('')}</div>`;
}
function pub(){
  let f=items.filter(i=>(i.name+' '+(i.cat||'')+' '+(i.note||'')).indexOf(q)>-1);
  const so=V('sort');
  f=f.slice().sort((a,b)=>so==='old'?(a.t||0)-(b.t||0):so==='name'?String(a.name).localeCompare(String(b.name),'ar'):(b.t||0)-(a.t||0));
  let h=`<div class="sec"><input id="q" placeholder="بحث…" value="${esc(q)}" style="width:100%"></div>`;
  if(!f.length)return h+'<div class="card empty">مفيش بيانات لسه</div>';
  if(V('group')&&ON('cat')){
    const g={},ord=[];f.forEach(i=>{const k=i.cat||'بدون تصنيف';if(!g[k]){g[k]=[];ord.push(k)}g[k].push(i)});
    ord.sort((a,b)=>a==='بدون تصنيف'?1:b==='بدون تصنيف'?-1:a.localeCompare(b,'ar'));
    return h+ord.map(k=>`<div class="gh">${esc(k)}<span>${g[k].length}</span></div>${block(g[k])}`).join('');
  }
  return h+block(f);
}
function admin(){
  const own=isOwner(),e=items.find(i=>i.id===editId)||{};
  let h='<div class="card sec" id="admin"><h2>لوحة التحكم</h2>';
  if(own)h+=`<div class="row sec"><input id="st" placeholder="عنوان الموقع" value="${esc(cfg.title)}"><input id="ss" placeholder="وصف قصير" value="${esc(cfg.subtitle)}"><button id="sv">حفظ العنوان</button></div>
  <h2>الحقول (غيّر الاسم أو شيل الحقل)</h2>${['name','value','cat','note'].map(k=>`<div class="row" style="margin-bottom:8px"><input id="lb_${k}" value="${esc(L(k))}">${k==='name'?'<span class="sub">أساسي</span>':`<label class="row sub" style="flex:none"><input type="checkbox" id="on_${k}" ${ON(k)?'checked':''}> ظاهر</label>`}</div>`).join('')}
  <div class="row sec"><button id="sf">حفظ الحقول</button></div>
  <h2>تقسيمة العرض</h2><div class="row sec">
  <label class="row sub">الشكل <select id="vv"><option value="cards"${V('view')==='cards'?' selected':''}>بطاقات</option><option value="list"${V('view')==='list'?' selected':''}>قائمة</option><option value="table"${V('view')==='table'?' selected':''}>جدول</option></select></label>
  <label class="row sub">الأعمدة <select id="vc">${[[0,'تلقائي'],[1,'1'],[2,'2'],[3,'3'],[4,'4']].map(x=>`<option value="${x[0]}"${+V('cols')===x[0]?' selected':''}>${x[1]}</option>`).join('')}</select></label>
  <label class="row sub">الترتيب <select id="vs"><option value="new"${V('sort')==='new'?' selected':''}>الأحدث أولاً</option><option value="old"${V('sort')==='old'?' selected':''}>الأقدم أولاً</option><option value="name"${V('sort')==='name'?' selected':''}>بالاسم</option></select></label>
  <label class="row sub"><input type="checkbox" id="vg" ${V('group')?'checked':''}> قسّم حسب التصنيف</label>
  <button id="sl">حفظ التقسيمة</button></div>`;
  h+=`<h2>${editId?'تعديل بيان':'إضافة بيان'}</h2><div class="row sec"><input id="fn" placeholder="${esc(L('name'))} *" value="${esc(e.name)}">
  ${ON('value')?`<input id="fv" placeholder="${esc(L('value'))}" value="${esc(e.value)}">`:''}${ON('cat')?`<input id="fc" placeholder="${esc(L('cat'))}" value="${esc(e.cat)}">`:''}</div>
  ${ON('note')?`<div class="row sec"><textarea id="fo" rows="2" placeholder="${esc(L('note'))}">${esc(e.note)}</textarea></div>`:''}
  <div class="row sec"><button id="ad">${editId?'حفظ التعديل':'إضافة'}</button>${editId?'<button class="g" id="cx">إلغاء</button>':''}</div>`;
  if(items.length){h+=`<div class="scroll sec"><table><thead><tr><th>${esc(L('name'))}</th>${ON('value')?`<th>${esc(L('value'))}</th>`:''}${ON('cat')?`<th>${esc(L('cat'))}</th>`:''}<th></th></tr></thead><tbody>`;
   items.forEach(i=>{h+=`<tr><td>${esc(i.name)}</td>${ON('value')?`<td>${esc(i.value)}</td>`:''}${ON('cat')?`<td>${esc(i.cat)}</td>`:''}<td><button class="g s" data-e="${i.id}">تعديل</button> <button class="d s" data-d="${i.id}">${delId===i.id?'تأكيد الحذف؟':'حذف'}</button></td></tr>`});
   h+='</tbody></table></div>'}
  if(own)h+='<h2>إعطاء الصلاحيات</h2><div class="row sec"><input id="us" placeholder="ابحث باسم المستخدم…" dir="ltr"></div><div id="ur" class="sec"></div>';
  return h+'</div>';
}
let ut=null;
async function drawUsers(){
  const r=$('ur'),us=$('us');if(!r)return;
  const qq=(us.value||'').trim().toLowerCase();
  let docs=[];
  try{docs=(await getDocs(query(collection(db,'users'),orderBy('username'),startAt(qq),endAt(qq+'\uf8ff'),limit(30)))).docs}catch(e){r.innerHTML='<div class="sub">تعذّر البحث.</div>';return}
  if(!docs.length){r.innerHTML='<div class="sub">مفيش حساب بالاسم ده.</div>';return}
  r.innerHTML='<div class="scroll"><table><thead><tr><th>اسم المستخدم</th><th>الصلاحية</th></tr></thead><tbody>'+docs.map(d=>{
    const u=d.data(),self=d.id===me.uid;
    return `<tr><td dir="ltr" style="text-align:right">${esc(u.username)}${self?' <span class="tag">أنت</span>':''}</td><td>${self?esc(RL[u.role]):`<select data-r="${d.id}">${['member','editor','owner'].map(k=>`<option value="${k}"${u.role===k?' selected':''}>${RL[k]}</option>`).join('')}</select>`}</td></tr>`}).join('')
    +'</tbody></table></div><div class="sub" style="margin-top:6px">عضو: دخول بس. محرر: يدير البيانات. مالك: كل حاجة.</div>';
  r.querySelectorAll('[data-r]').forEach(s=>{s.onchange=()=>updateDoc(doc(db,'users',s.dataset.r),{role:s.value}).catch(fail)});
}
function bind(){
  if($('lg'))$('lg').onclick=()=>{authOpen=true;authMode='login';render()};
  if($('tog'))$('tog').onclick=()=>{open=!open;render()};
  if($('out'))$('out').onclick=()=>signOut(auth);
  if($('acx'))$('acx').onclick=()=>{authOpen=false;render()};
  if($('asw'))$('asw').onclick=()=>{authMode=authMode==='reg'?'login':'reg';render()};
  if($('ago')){$('ago').onclick=doAuth;[$('au'),$('ap'),$('ap2')].forEach(x=>x&&x.addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()}))}
  const qi=$('q');
  if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)};
  if(!$('admin'))return;
  if($('sv')){
    $('sv').onclick=()=>setDoc(doc(db,'site','config'),{title:$('st').value.trim()||cfg.title,subtitle:$('ss').value.trim()},{merge:true}).catch(fail);
    $('sf').onclick=()=>{const f={};['name','value','cat','note'].forEach(k=>{const c=$('on_'+k);f[k]={l:$('lb_'+k).value.trim()||DF[k],off:c?!c.checked:false}});setDoc(doc(db,'site','config'),{f},{merge:true}).catch(fail)};
    $('sl').onclick=()=>setDoc(doc(db,'site','config'),{v:{view:$('vv').value,cols:+$('vc').value,sort:$('vs').value,group:$('vg').checked}},{merge:true}).catch(fail);
    $('us').oninput=()=>{clearTimeout(ut);ut=setTimeout(drawUsers,250)};drawUsers();
  }
  $('ad').onclick=async()=>{const n=$('fn').value.trim();if(!n)return $('fn').focus();
    const o={name:n};if($('fv'))o.value=$('fv').value.trim();if($('fc'))o.cat=$('fc').value.trim();if($('fo'))o.note=$('fo').value.trim();
    try{if(editId){await updateDoc(doc(db,'items',editId),o);editId=null}else{o.t=Date.now();await addDoc(collection(db,'items'),o)}}catch(e){fail(e)}
    render()};
  if($('cx'))$('cx').onclick=()=>{editId=null;render()};
  app.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{editId=b.dataset.e;render()});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(delId===b.dataset.d){const id=delId;delId=null;try{await deleteDoc(doc(db,'items',id))}catch(e){fail(e)}}else{delId=b.dataset.d;render()}});
}
function render(){
  $('ttl').textContent=cfg.title;$('sub').textContent=cfg.subtitle;document.title=cfg.title;
  $('hb').innerHTML=me?(canPanel()?`<button class="g" id="tog">${open?'إخفاء اللوحة':'لوحة التحكم'}</button>`:'')+`<span class="sub" dir="ltr">${esc(me.username)}</span><button class="g" id="out">تسجيل خروج</button>`:'<button class="g" id="lg">تسجيل دخول</button>';
  app.innerHTML=(authOpen&&!me?authForm():'')+(me&&!canPanel()?'<div class="card sec sub">اهلا بك في موقع  San George</div>':'')+(canPanel()&&open?admin():'')+pub();bind();
}
render();
</script>
</body>
</html>
